[package]
name = "local_os_agent"
version = "0.1.0"
edition = "2021"
default-run = "local_os_agent"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
anyhow = "1.0"
uuid = { version = "1.0", features = ["v4"] }
reqwest = { version = "0.11", features = ["json"] }
dotenvy = "0.15"
chrono = { version = "0.4", features = ["serde"] }
rusqlite = { version = "0.31", features = ["bundled"] }
r2d2 = "0.8"
r2d2_sqlite = "0.24"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
lazy_static = "1.4"
sysinfo = "0.30"
notify = "6.1"
yup-oauth2 = "9"
hyper = "0.14"
hyper-rustls = "0.25"
base64 = "0.21"
axum = "0.7"
tower-http = { version = "0.5", features = ["cors", "trace"] }
cron = "0.12"
regex = "1.10"
urlencoding = "2.1"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
image = "0.24"
lancedb = "0.4"
futures = "0.3"
# fastembed removed due to ort-sys build issues. Using OpenAI for now.
arrow = { version = "51", features = ["prettyprint"] }
log = "0.4"
calamine = "0.24"
pdf-extract = "0.7"
csv = "1.3"
dirs = "5.0"
socket2 = "0.5"

# JARVIS dependencies
async-trait = "0.1"
crossbeam = "0.8"
async-imap = "0.9"
async-native-tls = "0.5"
mail-parser = "0.9"
dashmap = "5.5"
toml = "0.8"
thiserror = "2.0.18"
winapi = { version = "0.3.9", features = ["winuser"] }
screenshots = "0.8.10"
lettre = { version = "0.11.19", features = ["tokio1-native-tls", "builder"] }
teloxide = { version = "0.17.0", features = ["macros"] }
tokio-util = { version = "0.7.18", features = ["compat"] }

# Observability - OpenTelemetry
opentelemetry = "0.22"
opentelemetry_sdk = { version = "0.22", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.15", features = ["tokio"] }
opentelemetry-semantic-conventions = "0.14"
prometheus = "0.13"


[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.9"
core-graphics = "0.23"
accessibility-sys = "0.1"
nix = { version = "0.27", features = ["signal"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_UI_Input",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Accessibility",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
] }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
