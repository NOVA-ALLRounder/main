# NOTE: This file is managed by scripts/set_privacy_level.ps1
# Available profiles: strict | balanced | permissive

mask_keys:
  - window_title
  - url
  - path
  - file_name
  - content_summary

hash:
  algorithm: sha256
  salt_env: DATA_COLLECTOR_SALT

hash_keys:
  - path
  - file_path
  - filepath
  - file_name

length_limits:
  window_title: 512
  url: 2048
  path: 128
  file_path: 128
  filepath: 128
  file_name: 64
  content_summary: 2048

url_policy:
  allow_full_url: false
  keep_domain_only: true

redaction_patterns:
  - name: email
    regex: '[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}'
  - name: phone
    regex: '\b(?:\+?\d{1,3}[-.\s]?)?(?:\(?\d{2,4}\)?[-.\s]?)?\d{3,4}[-.\s]?\d{4}\b'
  - name: long_digits
    regex: '\b\d{12,}\b'

drop_payload_keys:
  - document_title
  - tab_title
  - page_title
  - page_url
  - search_query
  - html
  - clipboard

allowlist_apps: []

denylist_apps:
  - keepass
  - 1password
  - lastpass
  - bitwarden
  - bankapp
  - personal_messenger

denylist_action: drop

denylist_domains:
  - accounts.google.com
  - login.microsoftonline.com
  - 1password.com
  - lastpass.com
  - bitwarden.com
  - paypal.com

denylist_domain_keywords:
  - login
  - signin
  - auth
  - password
  - bank
  - wallet
  - pay

denylist_domain_action: drop
